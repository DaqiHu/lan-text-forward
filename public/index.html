<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>局域网粘贴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 20px 12px;
    }

    /* ---- 顶部区块（始终在屏幕顶部） ---- */
    .top-bar {
      flex-shrink: 0;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      margin: 4px 0 8px;
    }
    .subtitle {
      text-align: center;
      color: #86868b;
      font-size: 14px;
      margin-bottom: 16px;
    }
    label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
      color: #424245;
    }
    select {
      font-size: 16px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #d2d2d7;
      background: #fff;
      appearance: auto;
      margin-bottom: 12px;
    }
    button {
      font-size: 16px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      background: #007aff;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-bottom: 4px;
    }
    button:active { background: #0056b3; }
    button:disabled { opacity: 0.5; }
    .hint {
      font-size: 12px;
      color: #86868b;
      text-align: center;
      margin-bottom: 12px;
    }

    /* ---- 文本框（撑满剩余空间，内容多时内部滚动） ---- */
    .textarea-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    textarea {
      flex: 1;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #d2d2d7;
      background: #fff;
      resize: none;
      line-height: 1.5;
      font-size: 16px;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    /* ---- 底部状态栏 ---- */
    #status {
      flex-shrink: 0;
      margin-top: 10px;
      font-size: 14px;
      color: #86868b;
      text-align: center;
      min-height: 20px;
    }
    #status.success { color: #30b94a; }
    #status.error { color: #ff3b30; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>📋 跨设备粘贴</h1>
    <p class="subtitle">手机打字，瞬间出现在电脑光标处</p>

    <label for="deviceSelect">目标设备</label>
    <select id="deviceSelect"></select>

    <button id="sendBtn">发送到光标位置</button>
    <p class="hint">Ctrl+Enter 发送 · Enter 换行</p>
  </div>

  <div class="textarea-wrap">
    <textarea id="input" placeholder="在此输入文字"></textarea>
  </div>

  <div id="status">加载设备列表...</div>

  <script>
    const deviceSelect = document.getElementById('deviceSelect');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    let ws = null;
    let selfId = null;
    let deviceList = [];

    async function loadDevices() {
      try {
        const res = await fetch('/devices');
        const data = await res.json();
        selfId = data.selfId;
        deviceList = data.devices;
        const prevValue = deviceSelect.value;
        deviceSelect.innerHTML = '';
        data.devices.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.id === selfId
            ? `${d.hostname} (${d.ip}) [本机]`
            : `${d.hostname} (${d.ip})`;
          if (d.id === selfId) opt.selected = true;
          deviceSelect.appendChild(opt);
        });
        if (prevValue && [...deviceSelect.options].some(o => o.value === prevValue)) {
          deviceSelect.value = prevValue;
        }
        setStatus('设备列表已更新');
      } catch {
        setStatus('获取设备列表失败', 'error');
      }
    }

    function connectWS() {
      if (ws) { ws.onclose = null; ws.close(); }
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => setStatus('已连接', 'success');
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'success') {
            setStatus('✔ ' + msg.message, 'success');
            input.value = '';
            input.focus();
          } else {
            setStatus('❌ ' + msg.message, 'error');
          }
        } catch { /* ignore */ }
      };
      ws.onclose = () => {
        setStatus('连接断开，3 秒后重连...', 'error');
        setTimeout(connectWS, 3000);
      };
      ws.onerror = () => setStatus('连接错误', 'error');
    }

    function setStatus(text, type) {
      statusDiv.textContent = text;
      statusDiv.className = type || '';
      if (type === 'success') {
        clearTimeout(statusDiv._timer);
        statusDiv._timer = setTimeout(() => {
          statusDiv.textContent = '设备列表已更新';
          statusDiv.className = '';
        }, 3000);
      }
    }

    function send() {
      const targetId = deviceSelect.value;
      const text = input.value.trim();
      if (!text) { setStatus('请输入文字', 'error'); return; }
      if (!ws || ws.readyState !== WebSocket.OPEN) { setStatus('未连接到服务端', 'error'); return; }
      ws.send(JSON.stringify({ targetId, text }));
      setStatus('发送中...');
      sendBtn.disabled = true;
      setTimeout(() => { sendBtn.disabled = false; }, 2000);
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        send();
      }
    });

    loadDevices();
    connectWS();
    setInterval(loadDevices, 30000);
    input.focus();
  </script>
</body>
</html>
